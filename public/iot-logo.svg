<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 176" width="960" height="176" fill="none">
  <!-- LOGOTIPO OFICIAL IOT TECHNOLOGIES - Business Innovation Solutions -->
  
  <!-- LETRA I (Slab Serif oficial) -->
  <g fill="#1D1D1B">
    <!-- Remate superior -->
    <rect x="38" y="33" width="56" height="17" rx="1" />
    <!-- Tallo vertical -->
    <rect x="57" y="50" width="18" height="74" />
    <!-- Remate inferior -->
    <rect x="38" y="124" width="56" height="17" rx="1" />
  </g>

  <!-- LETRA O CON APERTURA/SENSOR AZUL IOT -->
  <g>
    <!-- Aro negro exterior de la O -->
    <circle cx="172" cy="87" r="54" fill="#1D1D1B" />
    <circle cx="172" cy="87" r="36" fill="#FFFFFF" />

    <!-- Disco azul oficial (#3174A7) -->
    <circle cx="172" cy="87" r="31" fill="#3174A7" />

    <!-- Aro blanco interior concéntrico -->
    <circle cx="172" cy="87" r="19" fill="#FFFFFF" />
    <circle cx="172" cy="87" r="11" fill="#3174A7" />

    <!-- Muesca blanca diagonal hacia abajo-izquierda (225° / 7:30) -->
    <polygon points="165,94 172,87 146,113 141,108" fill="#FFFFFF" />
  </g>

  <!-- LETRA T -->
  <g fill="#1D1D1B">
    <!-- Barra horizontal superior -->
    <rect x="248" y="33" width="66" height="17" rx="1" />
    <!-- Tallo vertical -->
    <rect x="272" y="50" width="18" height="91" />
  </g>

  <!-- TECHNOLOGIES (Bold Corporate Sans-serif) -->
  <text
    x="332"
    y="109"
    fill="#1D1D1B"
    font-family="'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="74"
    font-weight="900"
    letter-spacing="2.5"
  >TECHNOLOGIES</text>

  <!-- LEYENDA: Business Innovation Solutions -->
  <text
    x="332"
    y="141"
    fill="#1D1D1B"
    font-family="'Open Sans', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="23"
    font-weight="600"
    letter-spacing="5.6"
    textLength="590"
    lengthAdjust="spacing"
  >Business Innovation Solutions</text>
</svg>
